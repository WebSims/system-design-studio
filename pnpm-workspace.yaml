packages:
  - "packages/*"
  - "apps/*"

# esbuild ships a prebuilt binary and its postinstall only links that binary
# into place. Approved explicitly so `pnpm install` does not halt waiting for
# interactive confirmation, which would break CI.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@xyflow/react@12.11.5'
  - '@xyflow/system@0.0.81'
